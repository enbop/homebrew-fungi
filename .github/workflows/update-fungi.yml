name: Update fungi cask

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel to sync
        required: true
        default: stable
        type: choice
        options:
          - stable
          - nightly
  repository_dispatch:
    types: [update_fungi_tap]

jobs:
  update-fungi:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Resolve channel
        id: channel
        run: |
          CHANNEL="${{ github.event.client_payload.channel || inputs.channel || 'stable' }}"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          if [ "$CHANNEL" = "nightly" ]; then
            echo "cask_path=Casks/fungi-nightly.rb" >> "$GITHUB_OUTPUT"
            echo "package_name=fungi-nightly" >> "$GITHUB_OUTPUT"
          else
            echo "cask_path=Casks/fungi.rb" >> "$GITHUB_OUTPUT"
            echo "package_name=fungi" >> "$GITHUB_OUTPUT"
          fi

      - name: Update cask from latest fungi release
        run: python3 scripts/update_cask.py fungi --channel "${{ steps.channel.outputs.channel }}"

      - name: Commit changes
        run: |
          if git diff --quiet -- "${{ steps.channel.outputs.cask_path }}"; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version=$(grep -E '^  version "' "${{ steps.channel.outputs.cask_path }}" | sed -E 's/.*"([^"]+)".*/\1/')
          git add "${{ steps.channel.outputs.cask_path }}"
          git commit -m "${{ steps.channel.outputs.package_name }}: ${version}"
          git push
